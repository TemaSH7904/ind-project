name: Super Hard CI/CD

on:
  push:
    branches: [ main ]

jobs:
  # Stage 1: Build and Push Docker Image
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Execute Build Script
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

  # Stage 2: Infrastructure Provisioning and Deployment
  deploy:
    name: Deploy Infrastructure
    needs: build
    runs-on: ubuntu-latest
    outputs:
      SERVER_IP: ${{ steps.get_ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Yandex Cloud CLI
        run: |
          curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
        
      - name: Provision and Deploy
        id: get_ip
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          CI: true
        run: |
          # Authentication
          echo "$YC_SA_JSON" > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json
          yc config set folder-id $YC_FOLDER_ID
          
          # Run Deployment Script
          chmod +x scripts/run.sh
          
          # Capture output to extract IP
          OUTPUT=$(./scripts/run.sh)
          echo "$OUTPUT"
          
          # Extract IP using the defined token
          DETECTED_IP=$(echo "$OUTPUT" | grep "DYNAMIC_IP_ADDRESS=" | cut -d'=' -f2)
          
          if [ -z "$DETECTED_IP" ]; then
            echo "Error: Could not detect IP address from output"
            exit 1
          fi
          
          echo "Detected IP: $DETECTED_IP"
          echo "ip=$DETECTED_IP" >> $GITHUB_OUTPUT

  # Stage 3: Integration Testing
  test:
    name: Integration Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Tests
        env:
          TARGET_IP: ${{ needs.deploy.outputs.SERVER_IP }}
        run: |
          chmod +x scripts/tests.sh
          ./scripts/tests.sh 3 $TARGET_IP