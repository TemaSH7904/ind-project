name: Super Hard CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Объявляем, что эта работа выдаст IP наружу
    outputs:
      vm_ip: ${{ steps.get_ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v3
      - name: Install YC CLI
        run: curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      - name: Auth and Deploy
        id: get_ip # Даем ID шагу, чтобы забрать его вывод
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          CI: true
        run: |
          echo "$YC_SA_JSON" > key.json
          export PATH=$PATH:$HOME/yandex-cloud/bin
          yc config profile create sa-profile
          yc config set service-account-key key.json
          yc config set folder-id $YC_FOLDER_ID
          chmod +x scripts/run.sh
          
          # Запускаем скрипт и сохраняем его вывод
          # Скрипт run.sh ДОЛЖЕН вывести строку типа: IP=89.169.x.x
          RESULT=$(./scripts/run.sh)
          echo "$RESULT"
          
          # Извлекаем IP из вывода и передаем в GitHub Actions Output
          EXTRACTED_IP=$(echo "$RESULT" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | head -n 1)
          echo "ip=$EXTRACTED_IP" >> $GITHUB_OUTPUT

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Cloud Tests
        run: |
          chmod +x scripts/tests.sh
          # Используем IP, полученный из предыдущего Job
          ./scripts/tests.sh 3 ${{ needs.deploy.outputs.vm_ip }}