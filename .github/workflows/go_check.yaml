name: Super Hard CI/CD

on:
  push:
    branches: [ main ]

jobs:
  # 1. Этап сборки и пуша образа
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

  # 2. Этап деплоя в облако (зависит от успешной сборки)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install YC CLI
        run: curl https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      - name: Auth and Deploy
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          CI: true
        run: |
          echo "$YC_SA_JSON" > key.json
          export PATH=$PATH:$HOME/yandex-cloud/bin
          yc config profile create sa-profile
          yc config set service-account-key key.json
          yc config set folder-id $YC_FOLDER_ID
          chmod +x scripts/run.sh
          ./scripts/run.sh

  # 3. Этап тестирования (зависит от успешного деплоя)
  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Cloud Tests
        run: |
          chmod +x scripts/tests.sh
          # Скрипт run.sh передает IP через окружение, либо используй статический
          ./scripts/tests.sh 3 89.169.165.238:8080